name: Bot NBA props

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-nba
  cancel-in-progress: false

jobs:
  run-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || echo "poppler absent"

      - name: Lancer le bot NBA
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: python -u Nba_bot.py

      - name: Verifier les picks du soir
        run: |
          python - <<'PY'
          import json, sys
          try:
              with open("historique_nba.json", encoding="utf-8") as f:
                  picks = json.load(f)["picks"]
          except Exception as e:
              sys.exit("historique_nba.json illisible : %s" % e)
          en_attente = [p for p in picks if p.get("res") is None]
          if not en_attente:
              sys.exit("ALERTE : aucun pick produit ce soir (bot silencieux ou donnees vides).")
          print("OK : %d pick(s) produit(s) ce soir." % len(en_attente))
          PY

      - name: Sauvegarder historique
        if: always()
        run: |
          git config user.name "bot-nba"
          git config user.email "bot-nba@users.noreply.github.com"
          git add -A historique_nba.json data_nba/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Suivi NBA $(date +%F)"
          git pull --rebase --autostash || true
          git push || true
