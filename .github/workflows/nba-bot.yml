name: Bot NBA props

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-nba
  cancel-in-progress: false

jobs:
  run-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests pypdf
          sudo apt-get install -y -qq poppler-utils
          command -v pdftotext || { echo "ERREUR : pdftotext manquant"; exit 1; }

      - name: Lancer le bot NBA
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: python -u Nba_bot.py

      - name: Verifier les picks du soir
        run: |
          python - <<'PY'
          import json, sys, datetime
          with open("historique_nba.json", encoding="utf-8") as f:
              picks = json.load(f)["picks"]
          seuil = (datetime.datetime.utcnow().date() - datetime.timedelta(days=1)).isoformat()
          recents = [p for p in picks if p.get("date", "") >= seuil]
          if not recents:
              print("ALERTE : aucun pick produit récemment.")
              sys.exit(1)
          print("OK : %d pick(s) récent(s) trouvé(s)." % len(recents))
          PY

      - name: Sauvegarder historique
        if: always()
        run: |
          git config user.name "bot-nba"
          git config user.email "bot-nba@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add historique_nba.json data_nba/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Suivi NBA $(date +%F)"
          git push

      - name: Alerte Telegram en cas d'echec
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ Bot NBA en échec ce soir. Va voir les logs sur GitHub Actions." \
            || true
